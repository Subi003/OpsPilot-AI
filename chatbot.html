<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpsPilot Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f5faf6;
        --panel: #ffffff;
        --panel-alt: #edf9f1;
        --primary: #0f7a4e;
        --primary-dark: #0b5d3a;
        --primary-soft: #d9f5e7;
        --secondary: #dfece5;
        --ink: #102019;
        --muted: #5b6f65;
        --border: #dfe8e1;
        --danger: #c53d3d;
        --danger-soft: #fde7e7;
        --warning: #c9801e;
        --warning-soft: #fff2db;
        --success: #1a8a4d;
        --shadow: 0 10px 30px rgba(15, 37, 27, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: linear-gradient(180deg, #eef7f1 0%, #f8faf9 100%);
        color: var(--ink);
        font-family: "Inter", sans-serif;
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }

      .shell {
        width: min(980px, 100%);
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 24px;
        backdrop-filter: blur(8px);
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 0.7rem;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 2vw, 2.4rem);
      }

      .btn {
        border: none;
        border-radius: 12px;
        padding: 12px 16px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s ease;
      }

      .btn:hover { transform: translateY(-1px); }

      .btn-primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        box-shadow: var(--shadow);
      }

      .btn-secondary {
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--border);
      }

      .upload-btn {
        position: relative;
        overflow: hidden;
      }

      .upload-btn input {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }

      .chat-box {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
      }

      .chat-messages {
        height: 440px;
        overflow-y: auto;
        padding: 18px;
        background: linear-gradient(180deg, #f9fbfa, #ffffff);
      }

      .chat-message {
        display: flex;
        margin-bottom: 14px;
      }

      .chat-message.user {
        justify-content: flex-end;
      }

      .bubble {
        max-width: 78%;
        padding: 12px 14px;
        border-radius: 14px;
        line-height: 1.5;
        font-size: 0.96rem;
      }

      .chat-message.bot .bubble {
        background: var(--panel-alt);
        border: 1px solid #dfeee5;
        color: var(--ink);
        border-bottom-left-radius: 4px;
      }

      .chat-message.user .bubble {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        border-bottom-right-radius: 4px;
      }

      .quick-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 14px 18px 0;
      }

      .quick-btn {
        background: var(--secondary);
        border: 1px solid var(--border);
        color: var(--ink);
        border-radius: 999px;
        padding: 8px 12px;
        cursor: pointer;
        font: inherit;
      }

      .composer {
        display: flex;
        gap: 10px;
        padding: 16px 18px 18px;
        border-top: 1px solid var(--border);
        background: #fbfdfc;
      }

      .composer input {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        font: inherit;
        color: var(--ink);
        background: white;
      }

      @media (max-width: 700px) {
        .page { padding: 18px; }
        .shell { padding: 18px; }
        .composer { flex-direction: column; }
        .bubble { max-width: 90%; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="shell">
        <div class="topbar">
          <div>
            <p class="eyebrow">Assistant</p>
            <h1>OpsPilot Chatbot</h1>
          </div>

          <div class="topbar-actions">
            <label class="btn btn-primary upload-btn" aria-label="Upload file">
              Upload file
              <input id="chatFileInput" type="file" accept=".csv,.xls,.xlsx" />
            </label>
            <a href="index.html" class="btn btn-secondary">Back to Dashboard</a>
          </div>
        </div>

        <div class="chat-box">
          <div class="chat-messages" id="chatMessages" aria-live="polite">
            <div class="chat-message bot">
              <div class="bubble">Hi! I can help with upload checks, column mapping, export steps, and the Always mode workflow.</div>
            </div>
          </div>

          <div class="quick-actions">
            <button class="quick-btn" type="button" data-prompt="How do I map revenue and expense columns?">Map columns</button>
            <button class="quick-btn" type="button" data-prompt="What does Always mode do?">Always mode</button>
            <button class="quick-btn" type="button" data-prompt="Help me export the report.">Export report</button>
          </div>

          <form class="composer" id="chatForm">
            <label class="sr-only" for="chatInput">Ask OpsPilot</label>
            <input id="chatInput" type="text" placeholder="Ask OpsPilot..." autocomplete="off" />
            <button class="btn btn-primary" type="submit">Send</button>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
      const chatMessages = document.getElementById('chatMessages');
      const chatForm = document.getElementById('chatForm');
      const chatInput = document.getElementById('chatInput');
      const chatFileInput = document.getElementById('chatFileInput');
      const quickButtons = document.querySelectorAll('.quick-btn');

      function addMessage(text, type = 'bot') {
        const row = document.createElement('div');
        row.className = `chat-message ${type}`;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        row.appendChild(bubble);
        chatMessages.appendChild(row);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function generateReply(prompt) {
        const text = prompt.toLowerCase();

        if (text.includes('map') || text.includes('revenue') || text.includes('expense')) {
          return 'Use the mapping section to select the Location / Branch column and the relevant Revenue and Expense columns. The app then aggregates rows by location and calculates EBITDA automatically.';
        }

        if (text.includes('always')) {
          return 'Always mode is a header explorer page for Excel/CSV files. It lets you upload a file, review all headers, and inspect unique values in a selected column before mapping your data.';
        }

        if (text.includes('export') || text.includes('csv')) {
          return 'Once the report is built, click Export CSV in the dashboard header. The app downloads a clean CSV file with Location, Revenue, Expense, and EBITDA columns.';
        }

        if (text.includes('upload') || text.includes('file')) {
          return 'You can upload CSV, XLS, or XLSX files from the dashboard. The app reads them in-browser and does not send your files to a backend.';
        }

        if (text.includes('privacy') || text.includes('secure') || text.includes('browser')) {
          return 'All processing is done in the current browser session. Uploaded files stay local to your device and are not uploaded to a server or external API.';
        }

        if (text.includes('hello') || text.includes('hi')) {
          return 'Hello! I can help with upload checks, mapping, report generation, and export steps.';
        }

        return 'I can help with mapping columns, uploading files, checking Always mode, and exporting the final report. Try asking: “How do I map revenue and expense columns?”';
      }

      chatFileInput.addEventListener('change', (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        addMessage(`Uploading ${file.name}...`, 'user');

        if (typeof XLSX === 'undefined') {
          addMessage('Spreadsheet support is unavailable because SheetJS failed to load.', 'bot');
          chatFileInput.value = '';
          return;
        }

        const reader = new FileReader();

        reader.onload = (loadEvent) => {
          try {
            const arrayBuffer = loadEvent.target.result;
            const workbook = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
            const sheetName = workbook.SheetNames[0];
            const sheet = workbook.Sheets[sheetName];
            const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

            addMessage(
              `${file.name} uploaded successfully. Found ${rows.length} row(s) in the first sheet. You can now use the dashboard mapping section or the Always mode explorer for the next step.`,
              'bot'
            );
          } catch (error) {
            addMessage(`I couldn’t read ${file.name}. Please upload a valid CSV, XLS, or XLSX file.`, 'bot');
          } finally {
            chatFileInput.value = '';
          }
        };

        reader.onerror = () => {
          addMessage(`I couldn’t read ${file.name}. Please try a different file.`, 'bot');
          chatFileInput.value = '';
        };

        reader.readAsArrayBuffer(file);
      });

      chatForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const value = chatInput.value.trim();
        if (!value) return;

        addMessage(value, 'user');
        chatInput.value = '';

        window.setTimeout(() => {
          addMessage(generateReply(value), 'bot');
        }, 180);
      });

      quickButtons.forEach((button) => {
        button.addEventListener('click', () => {
          const prompt = button.dataset.prompt || '';
          if (!prompt) return;
          addMessage(prompt, 'user');
          window.setTimeout(() => {
            addMessage(generateReply(prompt), 'bot');
          }, 150);
        });
      });
    </script>
  </body>
</html>
